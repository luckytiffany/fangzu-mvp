<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>房租水电管理</title>
<style>
  :root{
    --bg:#f5f2ed; --card:#fffefb; --line:#e8e3da; --ink:#2b3a2b; --sub:#6e7d6e;
    --brand:#5d8c5d; --brand-soft:#e8f0e5; --brand-d:#3d6a3d; --ok:#5d8c5d; --warn:#c49a3b; --danger:#b85656;
    --gold:#c8a876; --gold-soft:#f5efe4; --ink2:#4a5a4a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65}
  /* 米纸纹理底 */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:-1;
    background:radial-gradient(circle at 20% 10%, rgba(93,140,93,.10) 0, transparent 28%),
               radial-gradient(circle at 90% 80%, rgba(200,168,118,.12) 0, transparent 24%);
  }
  .app{display:flex;min-height:100vh}
  /* 顶部常驻菜单按钮 */
  /* 底部固定 tab 导航（兼容 iOS 安全区+微信 WebView） */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:120;display:flex;
    background:rgba(255,255,255,.98);
    -webkit-backdrop-filter:saturate(160%) blur(8px);backdrop-filter:saturate(160%) blur(8px);
    border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(43,58,43,.08);
    box-sizing:border-box;
    /* 优先 env，再 fallback 到 constant（旧 iOS）和固定值 */
    padding:8px 4px 8px;
    padding-bottom:calc(8px + constant(safe-area-inset-bottom));
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
    min-height:70px;
    min-height:calc(70px + env(safe-area-inset-bottom));
    /* 强制硬件加速，防止 iOS 滚动时固定元素闪烁/被裁剪 */
    -webkit-transform:translateZ(0);transform:translateZ(0);
    will-change:transform;
  }
  .bottom-nav .tab{flex:1;background:none;border:none;border-radius:16px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--sub);cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;transition:color .15s}
  .bottom-nav .tab .ti{font-size:23px;line-height:1;transition:transform .15s}
  .bottom-nav .tab .tl{font-size:13px;font-weight:700;white-space:nowrap}
  .bottom-nav .tab.active{color:var(--brand-d)}
  .bottom-nav .tab.active .ti{transform:translateY(-1px) scale(1.06)}
  .bottom-nav .tab.active::before{content:"";position:absolute;top:5px;width:26px;height:4px;border-radius:3px;background:var(--brand)}
  .bottom-nav .tab:active{transform:translateY(1px)}
  /* 二级菜单：从一级 tab 正上方上滑展开的竖排列表毛玻璃弹层（不遮挡一级菜单） */
  .tab-sheet{position:fixed;inset:0;z-index:130;display:none}
  .tab-sheet.open{display:block}
  /* 外部遮罩只做轻微压暗，毛玻璃效果留给二级菜单面板 */
  .tab-sheet-mask{position:absolute;inset:0;background:rgba(28,38,28,.18)}
  .tab-sheet-panel{
    position:absolute;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
    border:1px solid rgba(255,255,255,.7);
    border-radius:16px;padding:8px 4px;max-height:62vh;overflow:auto;
    box-shadow:0 14px 44px rgba(43,58,43,.22);
    animation:popUp .18s ease-out;transform-origin:bottom center}
  @keyframes popUp{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  /* 指向一级 tab 的小箭头，标明展开来源 */
  .tab-sheet-arrow{position:absolute;bottom:-8px;width:16px;height:16px;left:50%;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
    border-right:1px solid rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.7);
    transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:3px}
  .tab-sheet-items{display:flex;flex-direction:column}
  .tab-item{
    display:flex;align-items:center;justify-content:center;
    width:100%;text-align:center;padding:12px 10px;border-radius:12px;
    background:transparent;border:none;border-bottom:1px solid rgba(43,58,43,.08);
    color:var(--ink2);font-size:15px;font-weight:700;cursor:pointer;transition:.12s;
    -webkit-tap-highlight-color:transparent}
  .tab-item:last-child{border-bottom:none}
  .tab-item:active,.tab-item:hover{background:rgba(93,140,93,.10)}
  .tab-item.active{background:var(--brand-soft);color:var(--brand-d)}
  /* 二级菜单不再显示一级菜单名称标题 */
  .tab-sheet-title{display:none}
  /* 内容区：底部留白必须覆盖导航栏+安全区，防止被遮挡 */
  .content{flex:1;padding:18px;min-width:0;padding-bottom:96px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .topbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(43,58,43,.05)}
  .topbar .ico{font-size:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 10px rgba(43,58,43,.06)}
  .card h2{margin:0 0 14px;font-size:19px;color:var(--ink2)}
  .card h3{margin:0 0 10px;font-size:17px;color:var(--ink2)}
  .bp-trend-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .bp-trend-head h3{margin:0}
  .bp-period-sel{font-size:13px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink2);max-width:48%}
  label{display:block;font-size:15px;color:var(--sub);margin:10px 0 5px;font-weight:600}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink);box-sizing:border-box}
  input[type="date"]{-webkit-appearance:none;appearance:none}
  .bp-date-field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink);box-sizing:border-box;min-height:44px;display:flex;align-items:center;cursor:pointer;position:relative}
  .bp-date-field::after{content:"▼";position:absolute;right:12px;top:50%;transform:translateY(-50%) scaleX(.85);font-size:12px;color:var(--sub);pointer-events:none}
  .bp-date-field span{flex:1}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  input:disabled,select:disabled{background:#efece4;color:#8a948a;cursor:not-allowed}
  button:disabled{opacity:.55;cursor:not-allowed}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .picker-mask{position:fixed;inset:0;background:rgba(40,46,40,.45);z-index:300;display:flex;align-items:flex-end;justify-content:center;transition:opacity .18s;opacity:0}
  .picker-mask.open{opacity:1}
  .picker-panel{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(20,30,20,.22);transform:translateY(100%);transition:transform .22s ease-out}
  .picker-mask.open .picker-panel{transform:translateY(0)}
  .picker-title{text-align:center;font-weight:700;font-size:17px;color:var(--ink2);margin-bottom:14px}
  .picker-wheels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:210px;position:relative;margin-bottom:16px}
  .picker-wheels::before{content:"";position:absolute;top:50%;left:0;right:0;height:42px;transform:translateY(-50%);background:var(--brand-soft);border-radius:10px;z-index:0;pointer-events:none}
  .wheel{height:210px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;position:relative;z-index:1;mask-image:linear-gradient(to bottom,transparent 0,#000 36px,#000 174px,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 36px,#000 174px,transparent 100%)}
  .wheel-items{padding:84px 0}
  .wheel-item{height:42px;line-height:42px;text-align:center;font-size:16px;color:var(--sub);scroll-snap-align:center}
  .wheel-item.active{color:var(--ink2);font-weight:700}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  @media(max-width:760px){.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
  .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 3px 10px rgba(61,106,61,.22)}
  .btn-primary:active{filter:brightness(.95);transform:translateY(1px)}
  .btn-ghost{background:var(--brand-soft);color:var(--brand-d)}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#b08c5a);color:#fff;box-shadow:0 3px 10px rgba(176,140,90,.22)}
  .btn-gold:active{filter:brightness(.95)}
  .btn-danger{background:#fff;border:1px solid var(--danger);color:var(--danger)}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--sub);font-weight:700;background:#faf8f3}
  td input{width:96px;padding:9px;border-radius:10px;font-size:15px}
  .muted{color:var(--sub);font-size:14px}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
  .badge-soon{background:#f9f1d8;color:var(--warn)}
  .badge-expired{background:#f8e5e3;color:var(--danger)}
  .badge-ok{background:#e8f0e5;color:var(--ok)}
  .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  @media(min-width:860px){.summary{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:480px){.summary{grid-template-columns:1fr}}
  .stat{background:linear-gradient(135deg,var(--brand-soft),#f7f4ee);border-radius:14px;padding:14px;border:1px solid #dce8da}
  .stat .k{font-size:14px;color:var(--brand-d);font-weight:700}
  .stat .v{font-size:24px;font-weight:800;color:var(--brand-d);margin-top:4px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b3a2b;color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .empty{color:var(--sub);text-align:center;padding:28px 0;font-size:16px}
  .hint{font-size:14px;color:var(--ink2);background:#f9f6ef;border:1px solid #e8e0d0;border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.7}
  .banner{background:#f9f1d8;border:1px solid #e8d8b0;border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:15px;line-height:1.8}
  .banner b{color:var(--warn)}
  .card.alert{border-color:var(--danger);background:#fff8f5;box-shadow:0 0 0 4px rgba(192,72,59,.08)}
  .tag-ok{color:var(--ok);font-weight:700}
  .tag-warn{color:var(--warn);font-weight:700}
  .prop-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#faf8f3;border:1px solid var(--line);border-radius:14px;cursor:pointer;font-weight:800;font-size:17px;margin-bottom:10px}
  .prop-head:hover{background:#f3efe7}
  .prop-head .chev{color:var(--sub);transition:.2s}
  .prop-head.open .chev{transform:rotate(90deg)}
  /* 生成账单-房间折叠 */
  .bill-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:8px 4px;border-radius:12px}
  .bill-head:hover{background:#f8f6f1}
  .bill-head:active{background:#f0ece3}
  .bill-title{display:flex;align-items:center;gap:11px;min-width:0}
  .bill-title .chev{color:var(--sub);transition:transform .2s;font-size:16px;display:inline-block}
  .room-name{font-size:24px;font-weight:800;color:var(--ink2);letter-spacing:.5px}
  .bill-body{padding-top:4px}
  /* 账单用量核对表格 */
  .bill-detail-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}
  .bill-detail-table th,.bill-detail-table td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
  .bill-detail-table th{background:#faf8f3;color:var(--sub);font-weight:700}
  .bill-detail-table td:first-child,.bill-detail-table th:first-child{text-align:left}
  .bill-detail-table .amt{font-weight:800;color:var(--brand-d)}
  /* 通用弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(28,38,28,.46);display:none;align-items:flex-start;justify-content:center;z-index:300;padding:48px 16px;overflow:auto}
  .modal-mask.open{display:flex}
  .modal-box{background:var(--card);border-radius:20px;max-width:820px;width:100%;padding:24px;position:relative;box-shadow:0 24px 70px rgba(20,30,20,.28);animation:popIn .18s ease-out}
  .modal-box h2{margin:0 0 16px;font-size:21px;color:var(--ink2);padding-right:44px}
  /* 弹窗内的操作按钮统一居中 */
  .modal-box .row-actions{justify-content:center}
  .modal-box .row-actions>*{flex:0 0 auto !important}
  .modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(184,86,86,.35);z-index:5}
  .modal-close:active{filter:brightness(.94)}
  .stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
  @media(max-width:560px){.stat-cards{grid-template-columns:1fr}}
  .stat-card{background:linear-gradient(135deg,#fffefb,#f3efe6);border:1px solid var(--line);border-radius:18px;padding:24px 20px;cursor:pointer;text-align:center;box-shadow:0 3px 10px rgba(43,58,43,.06);transition:.15s}
  .stat-card:hover{transform:translateY(-2px);border-color:#d0e0d0;box-shadow:0 8px 20px rgba(61,106,61,.14)}
  .stat-card .ico{font-size:34px}
  .stat-card .t{font-size:19px;font-weight:800;color:var(--ink2);margin-top:8px}
  .stat-card .d{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.6}
  /* 首页占位布局 */
  .home-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .home-header .loc{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--ink2)}
  .home-greet h1{margin:0;font-size:26px;color:var(--ink2);line-height:1.3}
  .home-greet p{margin:6px 0 0;color:var(--sub);font-size:15px}
  .home-hero{position:relative;background:linear-gradient(160deg,var(--brand-soft) 0%,#f5efe4 100%);border:1px solid var(--line);border-radius:22px;padding:28px 22px;margin:18px 0;text-align:center;overflow:hidden}
  .home-hero .big-ico{font-size:86px;line-height:1;margin:8px 0}
  .home-hero .float-card{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:10px 14px;box-shadow:0 4px 14px rgba(43,58,43,.1);font-size:13px;color:var(--sub);text-align:left}
  .home-hero .float-card b{display:block;color:var(--brand-d);font-size:15px}
  .home-cta{display:flex;justify-content:center;margin:18px 0}
  .home-cta .btn-primary{border-radius:30px;padding:14px 32px;font-size:17px;display:inline-flex;align-items:center;gap:8px}
  .home-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
  .home-quick .qk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
  .home-quick .qk .num{font-size:22px;font-weight:800;color:var(--brand-d)}
  .home-quick .qk .lab{font-size:12px;color:var(--sub);margin-top:4px}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .home-area{position:relative;background:linear-gradient(135deg,#fffefb,#f6f3ec);border:1px solid var(--line);border-radius:18px;padding:18px 14px;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;box-shadow:0 3px 10px rgba(43,58,43,.05)}
  .home-area .badge{position:absolute;top:-8px;left:12px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(61,106,61,.25)}
  .home-area .ico{font-size:30px}
  .home-area .t{font-size:16px;font-weight:800;color:var(--ink2)}
  .home-area .d{font-size:12px;color:var(--sub);line-height:1.5}
  @media(max-width:560px){.home-quick{grid-template-columns:repeat(2,1fr)}.home-grid{grid-template-columns:1fr}}
  @media(max-width:760px){.app{flex-direction:column}.content{padding-left:14px;padding-right:14px}}
  /* 入口登录页 */
  #authScreen{position:fixed;inset:0;background:linear-gradient(160deg,#e8f0e5 0%,#f5efe4 60%,#f5f2ed 100%);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
  body.logged-out #authScreen{display:flex}
  body.logged-out .app{display:none}
  .auth-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 26px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(43,58,43,.12)}
  .auth-card .brand{font-size:24px;justify-content:center;padding-bottom:6px}
  .auth-card .sub{text-align:center;color:var(--sub);font-size:15px;margin:6px 0 22px}
  .auth-card label{margin-top:14px}
  .auth-card .row-actions{margin-top:20px}
  .auth-card .switch{text-align:center;margin-top:18px;font-size:15px;color:var(--sub)}
  .auth-card .switch a{color:var(--brand-d);cursor:pointer;font-weight:700}
  .auth-err{color:var(--danger);font-size:15px;min-height:20px;margin-top:10px}
  .auth-hint{color:var(--brand-d);font-size:14px;text-align:center;margin:8px 0 2px;font-weight:700}
</style>
</head>
<body class="logged-out">
<div class="app">
  <main class="content" id="content">
    <div id="contentInner"></div>
  </main>
  <!-- 底部固定 tab 导航 -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="tab" data-group="g_home" onclick="openTab('g_home',this)"><span class="ti">🏠</span><span class="tl">首页</span></button>
    <button class="tab" data-group="g1" onclick="openTab('g1',this)"><span class="ti">🏢</span><span class="tl">房屋管理</span></button>
    <button class="tab" data-group="g_bill" onclick="openTab('g_bill',this)"><span class="ti">🧾</span><span class="tl">账单管理</span></button>
    <button class="tab" data-group="g4" onclick="openTab('g4',this)"><span class="ti">👤</span><span class="tl">我的</span></button>
  </nav>
  <div class="tab-sheet" id="tabSheet">
    <div class="tab-sheet-mask" onclick="closeTabSheet()"></div>
    <div class="tab-sheet-panel" id="tabSheetPanel">
      <div class="tab-sheet-arrow" id="tabSheetArrow"></div>
      <div class="tab-sheet-title" id="tabSheetTitle"></div>
      <div class="tab-sheet-items" id="tabSheetItems"></div>
    </div>
  </div>
</div>
<div class="modal-mask" id="modalMask"><div class="modal-box" id="modalBox"></div></div>
<div class="picker-mask" id="bpDatePickerMask" style="display:none" onclick="if(event.target===this)closeBPDatePicker()">
  <div class="picker-panel" id="bpDatePickerPanel">
    <div class="picker-title">选择日期</div>
    <div class="picker-wheels">
      <div class="wheel" id="wheelYear"><div class="wheel-items" id="wheelYearItems"></div></div>
      <div class="wheel" id="wheelMonth"><div class="wheel-items" id="wheelMonthItems"></div></div>
      <div class="wheel" id="wheelDay"><div class="wheel-items" id="wheelDayItems"></div></div>
    </div>
    <div class="picker-actions">
      <button class="btn-line" onclick="closeBPDatePicker()">取消</button>
      <button class="btn-primary" onclick="confirmBPDatePicker()">确定</button>
    </div>
  </div>
</div>
<div id="authScreen">
  <div class="auth-card">
    <div class="brand"><span class="logo">🏠</span>房租水电管理<small>房东好帮手</small></div>

<script>
const KEY="rental_mvp_v1";
const DEF={water:3.5,elec:0.65,gas:3.2,hot:8,mgmt:100};
let state=load();
let editingRoomId=null;
let lastReadMonth=curMonth(),lastBillMonth=curMonth(),lastHistoryMonth=prevMonth(curMonth());
let _authProp=null;        // 当前正在管理授权的房源
let delegated=[];          // 受托人视角：被授权的楼栋及房间/读数
let myAuths=[];            // 房东视角：我发出的授权列表

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));
    if(s){
      s.propDefaults=s.propDefaults||{};
      s.properties=s.properties||[];
      // 迁移：旧的全局 defaults → 各房源独立默认费用
      if(s.defaults){
        s.properties.forEach(p=>{ if(!s.propDefaults[p.id]) s.propDefaults[p.id]=Object.assign({},s.defaults); });
        delete s.defaults;
      }
      if(s.rooms&&s.rooms.length&&!s.properties.length){
        const pid=uid();s.properties=[{id:pid,name:'默认楼栋',location:''}];
        s.rooms.forEach(r=>r.propertyId=pid);
      }
      s.rooms=s.rooms||[];s.readings=s.readings||[];s.bp=s.bp||[];
      normalizePropDefaults(s);
      return s;
    }
  }catch(e){}
  return {properties:[],propDefaults:{},rooms:[],readings:[],bp:[]};
}
function normalizePropDefaults(s){
  s.propDefaults=s.propDefaults||{};
  s.properties.forEach(p=>{
    const d=s.propDefaults[p.id]||{};
    ['water','elec','gas','hot','mgmt'].forEach(k=>{ if(d[k]==null) d[k]=DEF[k]; });
    s.propDefaults[p.id]=d;
  });
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));scheduleSync();}
function $(id){return document.getElementById(id);}
function fmt(n){if(n==null||isNaN(n))return "0.00";return Number(n).toFixed(2);}
function curMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function prevMonth(m){const[y,mm]=m.split("-").map(Number);const d=new Date(y,mm-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function monthLabel(m){const[y,mm]=m.split("-");return y+"年"+Number(mm)+"月";}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getProp(id){return state.properties.find(p=>p.id===id);}
function getPropName(room){const p=getProp(room.propertyId);return p?p.name:'出租楼';}
function getPropDefault(pid,key){const d=(state.propDefaults&&state.propDefaults[pid])||{};return d[key]!=null?d[key]:DEF[key];}

/* ---------- 导航（弹窗抽屉式） ---------- */
const NAV_GROUPS={
  g_home:{title:'首页', children:[]},
  g1:{title:'房屋管理', children:[
    {v:'addProperty',l:'添加房源'},
    {v:'addRoom',l:'添加房间'},
    {v:'roomList',l:'房间列表'},
    {v:'defaultFees',l:'水电费用'}
  ]},
  g_bill:{title:'账单管理', children:[
    {v:'bill',l:'本月账单'},
    {v:'history',l:'历史账单'},
    {v:'reading',l:'录入本月读数'}
  ]},
  g4:{title:'个人中心', children:[
    {v:'stats',l:'数据统计'},
    {v:'bp',l:'血压管理'},
    {v:'settings',l:'设置'}
  ]}
};
let currentView='home';
function groupOfView(v){if(v==='home')return 'g_home';for(const g in NAV_GROUPS){if(NAV_GROUPS[g].children.some(c=>c.v===v))return g;}return null;}
function highlightTab(){const g=groupOfView(currentView);
  document.querySelectorAll('.bottom-nav .tab').forEach(t=>t.classList.toggle('active',t.dataset.group===g));}
let _openTabEl=null;
function openTab(g, el){
  const gp=NAV_GROUPS[g]; if(!gp)return;
  _openTabEl=el||document.querySelector('.bottom-nav .tab[data-group="'+g+'"]');
  // 没有二级菜单的 tab（如首页）直接跳转
  if(!gp.children.length){showView('home');closeTabSheet();return;}
  if($('tabSheet').classList.contains('open') && $('tabSheet').dataset.group===g){closeTabSheet();return;}
  $('tabSheet').dataset.group=g;
  $('tabSheetTitle').textContent=gp.title;
  $('tabSheetItems').innerHTML=gp.children.map(c=>
    `<button class="tab-item ${currentView===c.v?'active':''}" data-view="${c.v}" onclick="showView('${c.v}');closeTabSheet()">${c.l}</button>`
  ).join('');
  document.querySelectorAll('.bottom-nav .tab').forEach(t=>t.classList.toggle('active',t.dataset.group===g));
  $('tabSheet').classList.add('open');
  positionTabSheet();
}
/* 把二级菜单定位到被点击的一级 tab 正上方，箭头指向该 tab */
function positionTabSheet(){
  const panel=$('tabSheetPanel'), arrow=$('tabSheetArrow'), nav=$('bottomNav');
  if(!panel||!nav||!$('tabSheet').classList.contains('open')) return;
  const navRect=nav.getBoundingClientRect();
  const tabW=_openTabEl?_openTabEl.getBoundingClientRect().width:(window.innerWidth/4);
  // 二级菜单宽度与一级 tab 保持一致，文字居中
  const pw=Math.min(window.innerWidth-20, Math.max(tabW, 110));
  let tabCenter=window.innerWidth/2;
  if(_openTabEl){const r=_openTabEl.getBoundingClientRect(); tabCenter=r.left+r.width/2;}
  let left=Math.max(10, Math.min(tabCenter-pw/2, window.innerWidth-pw-10));
  panel.style.width=pw+'px';
  panel.style.left=left+'px';
  panel.style.bottom=(window.innerHeight-navRect.top+10)+'px'; // 落在导航栏顶边之上
  const arrowLeft=Math.max(16, Math.min(tabCenter-left, pw-16));
  arrow.style.left=arrowLeft+'px';
}
function closeTabSheet(){$('tabSheet').classList.remove('open');$('tabSheet').dataset.group='';_openTabEl=null;highlightTab();}
function showView(v){
  currentView=v;
  document.querySelectorAll("[data-view]").forEach(c=>c.classList.toggle("active",c.dataset.view===v));
  highlightTab();
  const fn={home:renderHome,addProperty:renderAddProperty,addRoom:renderAddRoom,defaultFees:renderDefaultFees,
    roomList:renderRoomList,reading:renderReading,bill:renderBill,history:renderHistoryBill,
    data:renderData,cloud:renderCloud,auth:renderAuthManage,stats:renderStats,bp:renderBP,settings:renderSettings}[v];
  if(fn)fn();
  window.scrollTo(0,0);
}
// ESC 关闭底部弹层
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTabSheet();});

/* iOS/微信 WebView 底部固定导航稳定性修复：视口变化时强制重绘，防止工具栏遮挡 */
function fixBottomNav(){
  const nav=$('bottomNav'); if(!nav) return;
  const d=nav.style.display; nav.style.display='none'; nav.offsetHeight; nav.style.display=(d||'flex');
}
let _resizeTimer=null;
window.addEventListener('resize',()=>{clearTimeout(_resizeTimer); _resizeTimer=setTimeout(fixBottomNav,80);});
window.addEventListener('orientationchange',()=>setTimeout(()=>{fixBottomNav();positionTabSheet();},200));
if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{fixBottomNav();positionTabSheet();});}

/* ---------- 添加房源 ---------- */
function renderAddProperty(){

  <div class="card">
    <h2>新建楼栋 / 房源</h2>

}
function renderPropMini(){
  const box=$("propListMini");if(!box)return;
  if(!state.properties.length){box.innerHTML='<div class="empty">还没有房源</div>';return;}
  const rows=state.properties.map(p=>`<tr><td><b>${escapeHtml(p.name)}</b></td><td class="muted">${escapeHtml(p.location||"未填地址")}${p.lat?` · ${fmt(p.lat)},${fmt(p.lng)}`:""}</td>

    <table><thead><tr><th>名称</th><th>地址/定位</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function saveProperty(){
  const name=$("p_name").value.trim();if(!name){toast("请填写房源名称");return;}
  if(state.properties.some(p=>p.name===name)){toast("房源名称已存在");return;}
  state.properties.push({id:uid(),name,location:$("p_loc").value.trim(),lat:null,lng:null});
  save();$("p_name").value="";$("p_loc").value="";renderPropMini();toast("房源已保存");
}
function delProperty(id){
  const p=getProp(id);if(!p)return;
  if(!confirm(`删除房源「${p.name}」？其下 ${state.rooms.filter(r=>r.propertyId===id).length} 个房间及抄表记录也会删除。`))return;
  state.properties=state.properties.filter(x=>x.id!==id);
  const rids=state.rooms.filter(r=>r.propertyId===id).map(r=>r.id);
  state.rooms=state.rooms.filter(r=>r.propertyId!==id);
  state.readings=state.readings.filter(r=>!rids.includes(r.roomId));
  save();renderPropMini();toast("已删除");
}
function getGeo(){
  if(!navigator.geolocation){toast("当前环境不支持定位，请手动填写");return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const la=pos.coords.latitude,ln=pos.coords.longitude;
    $("p_loc").value=`经纬度 ${la.toFixed(5)},${ln.toFixed(5)}`;
    toast("已获取定位");
  },()=>toast("定位失败，请手动填写地址"),{enableHighAccuracy:true,timeout:8000});
}

          <div><label>水费（元/吨）</label><input id="fa_water" type="number" min="0" step="0.01" placeholder="3.5"></div>

function showFeeAddForm(){const f=$("feeAddForm");if(f)f.style.display='block';}
function hideFeeAddForm(){const f=$("feeAddForm");if(f){f.style.display='none';

function saveFeeAdd(){

  save();toast("已新增「"+(getProp(pid)?getProp(pid).name:"")+"」水电费用");renderDefaultFees();
}
function togglePropFee(pid){

function leaseInfo(r){
  if(!r.leaseEnd)return null;
  const end=new Date(r.leaseEnd+"T00:00:00");const today=new Date();today.setHours(0,0,0,0);
  const days=Math.round((end-today)/86400000);
  if(days<0)return {type:'expired',days:Math.abs(days)};
  if(days<=30)return {type:'soon',days};
  return {type:'ok',days};
}

function recalcRead(rid){

function validateReadD(rid){

async function saveDelegateReading(ownerId,rid){

async function saveAuth(pid){
  const sb=getClient();if(!sb){toast("未连接云端");return;}
  const phone=$("au_phone").value.trim();
  if(!/^\d{6,15}$/.test(phone)){toast("请输入正确的手机号");return;}
  const start=$("au_start").value,end=$("au_end").value;
  if(!start||!end){toast("请选择起止日期");return;}
  if(new Date(end)<new Date(start)){toast("结束日期需晚于开始");return;}
  let code=$("au_code").value.trim().toUpperCase();if(!code)code=genAuthCode();
  const rec={owner_id:cloud.user.id,property_id:pid,authorized_phone:phone,code,
    start_at:new Date(start+"T00:00:00").toISOString(),end_at:new Date(end+"T23:59:59").toISOString()};
  const {error}=await sb.from('authorizations').insert(rec);
  if(error){toast("保存失败："+error.message);return;}
  toast("授权已生成："+code);
  await refreshDelegations();renderAuthManage();
}
async function revokeAuth(id){
  const sb=getClient();if(!sb)return;
  if(!confirm("撤销该授权？受托人将立即失去本楼栋的抄表权限。"))return;
  const {error}=await sb.from('authorizations').delete().eq('id',id);
  if(error){toast("撤销失败："+error.message);return;}
  toast("已撤销");await refreshDelegations();renderAuthManage();
}

/* ---------- 生成账单 ---------- */
function computeBill(r,reading){
  const get=(s,e)=>(reading&&reading[s]!=null&&reading[e]!=null)?(reading[e]-reading[s]):0;
  const wC=get('waterStart','waterEnd'),eC=get('elecStart','elecEnd'),gC=get('gasStart','gasEnd'),hC=get('hotStart','hotEnd');
  const wCost=wC*r.waterPrice,eCost=eC*r.elecPrice,gCost=gC*r.gasPrice,hotCost=hC*r.hotPrice;
  const util=wCost+eCost+gCost+hotCost;const total=r.rent+r.mgmtFee+util;
  return {wC,eC,gC,hC,wCost,eCost,gCost,hotCost,util,total};
}
function buildBillText(r,reading,m){
  const b=computeBill(r,reading);
  const L=[];
  L.push("【房租水电费通知】");
  L.push((r.tenant||"租户")+"（"+getPropName(r)+" "+r.name+"）：");
  L.push(monthLabel(m)+"费用如下：");
  L.push("• 月租："+fmt(r.rent)+" 元");
  L.push("• 管理费："+fmt(r.mgmtFee)+" 元");
  if(reading&&reading.waterStart!=null&&reading.waterEnd!=null)L.push("• 水费：用水 "+fmt(b.wC)+" 吨 × "+fmt(r.waterPrice)+" = "+fmt(b.wCost)+" 元");
  if(reading&&reading.elecStart!=null&&reading.elecEnd!=null)L.push("• 电费：用电 "+fmt(b.eC)+" 度 × "+fmt(r.elecPrice)+" = "+fmt(b.eCost)+" 元");
  if(reading&&reading.gasStart!=null&&reading.gasEnd!=null)L.push("• 燃气费：用气 "+fmt(b.gC)+" 方 × "+fmt(r.gasPrice)+" = "+fmt(b.gCost)+" 元");
  if(reading&&reading.hotStart!=null&&reading.hotEnd!=null)L.push("• 热水费：用热 "+fmt(b.hC)+" 吨 × "+fmt(r.hotPrice)+" = "+fmt(b.hotCost)+" 元");
  L.push("本月应交租金合计："+fmt(b.total)+" 元");
  L.push("请于每月约定日前支付，谢谢配合！");
  return L.join("\n");
}
function billCard(r,m){
  const reading=getReading(r.id,m);const b=computeBill(r,reading);

    {n:'水费',u:'吨',p:r.waterPrice,s:reading?reading.waterStart:null,e:reading?reading.waterEnd:null,c:b.wC,cost:b.wCost},

  return `<div class="card bill-card">
    <div class="bill-head" onclick="toggleBillRoom('${r.id}')">

/* ---------- 账单图片（16:9 插画风） ---------- */
function bi_roundRect(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}
function bi_cloud(x,cx,cy,r){x.beginPath();x.arc(cx,cy,r,Math.PI*.95,Math.PI*2.05);x.arc(cx+r*.8,cy+r*.32,r*.7,Math.PI*.95,Math.PI*2.05);x.arc(cx-r*.8,cy+r*.32,r*.7,Math.PI*.95,Math.PI*2.05);x.closePath();x.fill();}
function bi_house(x,bx,by,w,h){
  x.fillStyle='#ffffff';
  x.beginPath();x.moveTo(bx-12,by);x.lineTo(bx+w/2,by-h*.62);x.lineTo(bx+w+12,by);x.closePath();x.fill();
  x.fillRect(bx,by,w,h);
  x.fillStyle='rgba(15,184,106,.92)';x.fillRect(bx+w*.36,by+h*.42,w*.28,h*.58);
  x.fillStyle='rgba(255,255,255,.95)';x.fillRect(bx+w*.12,by+h*.16,w*.2,h*.2);x.fillRect(bx+w*.68,by+h*.16,w*.2,h*.2);
}
function bi_coin(x,cx,cy,r){
  x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fillStyle='#ffd45e';x.fill();
  x.lineWidth=Math.max(2,r*.12);x.strokeStyle='#efb429';x.stroke();
  x.fillStyle='#b9791a';x.font='bold '+(r*1.05)+'px -apple-system,"PingFang SC",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('¥',cx,cy+r*.04);
}
function downloadBillImage(rid,m){
  const r=state.rooms.find(x=>x.id===rid);if(!r)return;
  const reading=getReading(rid,m);const b=computeBill(r,reading);
  const W=1080,H=1440,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F='"PingFang SC","Microsoft YaHei",-apple-system,sans-serif';
  // 米色纸纹底
  x.fillStyle='#f7f4ee';x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.18;
  x.strokeStyle='#d8d0c0';x.lineWidth=1;
  for(let i=0;i<W;i+=34){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}
  for(let i=0;i<H;i+=34){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
  x.restore();
  // 表头：国风山水插画
  const hh=420;
  const g=x.createLinearGradient(0,0,0,hh);g.addColorStop(0,'#6b9b6b');g.addColorStop(.55,'#4f7d4f');g.addColorStop(1,'#3a613a');
  x.fillStyle=g;x.fillRect(0,0,W,hh);
  // 远山
  x.fillStyle='rgba(255,255,255,.12)';
  x.beginPath();x.moveTo(0,hh-60);x.quadraticCurveTo(220,hh-220,500,hh-80);x.quadraticCurveTo(760,hh-260,1080,hh-40);x.lineTo(W,hh);x.lineTo(0,hh);x.fill();
  x.fillStyle='rgba(255,255,255,.08)';
  x.beginPath();x.moveTo(0,hh-20);x.quadraticCurveTo(300,hh-160,620,hh-50);x.quadraticCurveTo(860,hh-180,1080,hh-10);x.lineTo(W,hh);x.lineTo(0,hh);x.fill();
  // 太阳/茶叶元素
  x.save();x.globalAlpha=.22;x.fillStyle='#f5e6c8';x.beginPath();x.arc(920,110,70,0,Math.PI*2);x.fill();x.restore();
  // 云
  x.save();x.globalAlpha=.18;x.fillStyle='#fff';bi_cloud(x,150,120,48);bi_cloud(x,360,170,34);bi_cloud(x,820,210,40);x.restore();
  // 茶舍小房子
  bi_house(x,60,260,130,96);
  // 金币点缀
  bi_coin(x,920,300,28);bi_coin(x,980,330,20);
  // 表头文字
  x.fillStyle='#ffffff';x.textBaseline='middle';x.textAlign='center';
  x.font='bold 56px '+F;
  x.fillText('【'+getPropName(r)+'】房租水电费账单',W/2,132);
  x.font='30px '+F;x.globalAlpha=.94;
  x.fillText(r.name+' · '+(r.tenant||'租户')+' · '+monthLabel(m),W/2,206);
  x.globalAlpha=1;
  // 白卡
  const cx=44,cy=460,cw=W-88,ch=H-cy-120;x.fillStyle='#fffefb';bi_roundRect(x,cx,cy,cw,ch,22);x.fill();
  x.strokeStyle='#e8e3da';x.lineWidth=2;bi_roundRect(x,cx,cy,cw,ch,22);x.stroke();
  // 卡片内装饰线
  x.strokeStyle='#c8a876';x.lineWidth=3;x.beginPath();x.moveTo(cx+30,cy+28);x.lineTo(cx+130,cy+28);x.stroke();
  // 用量核对表
  const rows=[];
  rows.push({name:'水费',unit:'吨',price:r.waterPrice,s:reading?reading.waterStart:null,e:reading?reading.waterEnd:null,c:b.wC,cost:b.wCost});
  rows.push({name:'电费',unit:'度',price:r.elecPrice,s:reading?reading.elecStart:null,e:reading?reading.elecEnd:null,c:b.eC,cost:b.eCost});
  rows.push({name:'燃气费',unit:'方',price:r.gasPrice,s:reading?reading.gasStart:null,e:reading?reading.gasEnd:null,c:b.gC,cost:b.gCost});
  rows.push({name:'热水费',unit:'吨',price:r.hotPrice,s:reading?reading.hotStart:null,e:reading?reading.hotEnd:null,c:b.hC,cost:b.hotCost});
  let y=cy+68;
  const lx=cx+30,rx=cx+cw-30;
  x.textAlign='left';x.font='bold 22px '+F;x.fillStyle='#4a5a4a';
  x.fillText('费用明细及用量核对',lx,y);y+=58;
  // 表头
  const cols=[{t:'项目',w:120},{t:'上期',w:150},{t:'本期',w:150},{t:'用量',w:150},{t:'金额',w:150}];
  let cx2=lx;
  x.font='bold 22px '+F;x.fillStyle='#6e7d6e';x.textBaseline='middle';
  cols.forEach(col=>{x.textAlign='center';x.fillText(col.t,cx2+col.w/2,y);cx2+=col.w;});
  y+=46;x.strokeStyle='#e8e3da';x.beginPath();x.moveTo(lx,y-10);x.lineTo(rx,y-10);x.stroke();
  // 行
  rows.forEach(row=>{
    const has=row.s!=null&&row.e!=null;
    cx2=lx;
    x.font='23px '+F;x.fillStyle='#2b3a2b';
    x.textAlign='center';x.fillText(row.name,cx2+60,y);cx2+=120;
    x.fillStyle='#6e7d6e';x.font='21px '+F;
    x.fillText(has?fmt(row.s):'—',cx2+75,y);cx2+=150;
    x.fillText(has?fmt(row.e):'—',cx2+75,y);cx2+=150;
    x.fillStyle='#2b3a2b';x.font='bold 21px '+F;
    x.fillText(has?fmt(row.c)+row.unit:'—',cx2+75,y);cx2+=150;
    x.fillStyle='#3d6a3d';x.font='bold 24px '+F;
    x.fillText(has?'¥'+fmt(row.cost):'未抄表',cx2+75,y);cx2+=150;
    y+=58;
  });
  // 固定费用行
  y+=8;
  const fixed=[['月租','',fmt(r.rent)],['管理费','',fmt(r.mgmtFee)]];
  fixed.forEach(([n,d,v])=>{
    x.textAlign='left';x.font='24px '+F;x.fillStyle='#2b3a2b';x.fillText(n,lx,y);
    if(d){x.font='19px '+F;x.fillStyle='#6e7d6e';x.fillText(d,lx+70,y);}

    y+=58;
  });
  // 合计
  y+=14;
  const ty=y;
  x.fillStyle='#e8f0e5';bi_roundRect(x,lx-10,ty-30,rx-lx+20,82,16);x.fill();
  x.strokeStyle='#d0e0d0';x.lineWidth=1;bi_roundRect(x,lx-10,ty-30,rx-lx+20,82,16);x.stroke();
  x.textAlign='left';x.font='bold 30px '+F;x.fillStyle='#3d6a3d';x.fillText('本月应交租金合计',lx,ty+8);
  x.textAlign='right';x.font='bold 48px '+F;x.fillStyle='#3d6a3d';x.fillText('¥'+fmt(b.total),rx,ty+8);
  y+=96;
  // 备注
  x.textAlign='left';x.font='19px '+F;x.fillStyle='#6e7d6e';
  const note=reading?'请于每月约定日前支付，转入后请截图留存，谢谢配合！':'本月账单尚在核算中，稍后更新。';
  x.fillText(note,lx,cy+ch-40);

  x.fillText('本账单由房东通过「房租水电管理」生成',W/2,H-34);
  // 导出 PNG
  c.toBlob(function(blob){
    if(!blob){toast('当前浏览器不支持生成图片');return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='账单_'+getPropName(r)+'_'+r.name+'_'+m+'.png';a.click();toast('账单图片已下载');
  },'image/png');
}

function saveBP(id){
  const dateRaw=$("bp_date").value;
  const period=$("bp_period").value;
  const high=parseFloat($("bp_high").value);
  const low=parseFloat($("bp_low").value);
  const hrRaw=$("bp_hr").value;
  if(!dateRaw){toast("请选择日期");return;}
  if(isNaN(high)||high<=0){toast("请填写有效的高压");return;}
  if(isNaN(low)||low<=0){toast("请填写有效的低压");return;}
  const hr=(hrRaw===""||isNaN(parseFloat(hrRaw)))?null:parseFloat(hrRaw);
  const date=dateRaw.replace(/-/g,"/"); // 展示格式 yyyy/mm/dd
  const now=new Date();
  const time=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  state.bp=state.bp||[];
  if(id){
    const r=state.bp.find(x=>x.id===id);
    if(r){r.date=date;r.time=time;r.period=period;r.high=high;r.low=low;r.hr=hr;}
  }else{
    state.bp.push({id:uid(),date,time,period,high,low,hr});
  }
  save();closeModal();renderBP();toast(id?"已更新":"已保存");
}
function deleteBP(id){
  if(!confirm("确定删除这条血压记录吗？"))return;
  state.bp=(state.bp||[]).filter(x=>x.id!==id);
  save();renderBP();toast("已删除");
}
let bpPickerTargetInput=null,bpPickerTargetDisplay=null;
function openBPDatePicker(inputId,displayId){
  bpPickerTargetInput=inputId;bpPickerTargetDisplay=displayId;
  const val=$(inputId).value||new Date().toISOString().slice(0,10);
  const [y,m,d]=val.split('-').map(Number);
  buildWheel('wheelYearItems',1980,2050,y);
  buildWheel('wheelMonthItems',1,12,m);
  buildWheel('wheelDayItems',1,31,d);
  const mask=$("bpDatePickerMask"); mask.style.display='flex';
  setTimeout(()=>{mask.classList.add('open');scrollToSelected('wheelYearItems');scrollToSelected('wheelMonthItems');scrollToSelected('wheelDayItems');},10);
}
function buildWheel(containerId,start,end,selected){
  let html='';
  for(let i=start;i<=end;i++){
    html+=`<div class="wheel-item${i===selected?' active':''}" data-val="${i}" onclick="wheelTap(this)">${String(i).padStart(2,'0')}</div>`;
  }
  $(containerId).innerHTML=html;
}
function scrollToSelected(containerId){
  const c=$(containerId); if(!c)return;
  const item=c.querySelector('.active')||c.firstElementChild;
  if(item){item.scrollIntoView({block:'center',behavior:'auto'});}
}
function wheelTap(el){
  const parent=el.parentElement;
  parent.querySelectorAll('.wheel-item').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  el.scrollIntoView({block:'center',behavior:'smooth'});
}
function getWheelVal(containerId){
  const c=$(containerId); if(!c)return null;
  const items=Array.from(c.querySelectorAll('.wheel-item'));
  // 找距离视口中心最近的元素
  const parent=c.parentElement;
  const center=parent.getBoundingClientRect().top+parent.clientHeight/2;
  let best=null,bestDist=Infinity;
  items.forEach(it=>{
    const d=Math.abs(it.getBoundingClientRect().top+it.clientHeight/2-center);
    if(d<bestDist){bestDist=d;best=it;}
  });
  return best?Number(best.dataset.val):null;
}
function closeBPDatePicker(){
  const mask=$("bpDatePickerMask"); mask.classList.remove('open');
  setTimeout(()=>{mask.style.display='none';},220);
}
function confirmBPDatePicker(){
  let y=getWheelVal('wheelYearItems');let m=getWheelVal('wheelMonthItems');let d=getWheelVal('wheelDayItems');
  if(y==null||m==null||d==null){toast("请选择完整日期");return;}

  if(bpPickerTargetInput){$(bpPickerTargetInput).value=dateStr;}

  closeBPDatePicker();
}

function drawBPTrend(canvasId){
  const cv=document.getElementById(canvasId); if(!cv)return;
  const W=680,H=330; const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  // 近 20 天
  const days=[]; const now=new Date();
  for(let i=19;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);days.push(d);}
  const labels=days.map(d=>(d.getMonth()+1)+'/'+d.getDate());
  // 按测量时段筛选
  const recs=(state.bp||[]).filter(r=>bpPeriodFilter==='全部'||r.period===bpPeriodFilter);
  const map={}; recs.forEach(r=>{ (map[r.date]=map[r.date]||[]).push(r); });
  const series={high:[],low:[],hr:[]};
  days.forEach(d=>{
    const key=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
    const arr=map[key]||[];
    if(arr.length){
      const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
      series.high.push(avg(arr.map(x=>x.high)));
      series.low.push(avg(arr.map(x=>x.low)));
      const hrs=arr.map(x=>x.hr).filter(v=>v!=null);
      series.hr.push(hrs.length?avg(hrs):null);
    } else { series.high.push(null); series.low.push(null); series.hr.push(null); }
  });
  const padL=46,padR=18,padT=30,padB=46;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const vals=[];
  series.high.concat(series.low).concat(series.hr.filter(v=>v!=null)).forEach(v=>{if(v!=null)vals.push(v);});
  if(!vals.length){ctx.fillStyle='#6e7d6e';ctx.font='16px "PingFang SC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('近 20 天暂无血压记录', W/2, H/2);return;}
  let min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(min===max){min-=10;max+=10;} else {const p=(max-min)*0.15; min=Math.floor(min-p); max=Math.ceil(max+p);}
  if(min<0)min=0;
  const xAt=i=> padL + (days.length<=1?plotW/2:plotW*i/(days.length-1));
  const yAt=v=> padT + plotH*(1-(v-min)/(max-min));
  // 网格 + Y 轴标签
  ctx.textBaseline='middle'; ctx.font='12px "PingFang SC",sans-serif';
  const ticks=4;
  for(let t=0;t<=ticks;t++){
    const v=min+(max-min)*t/ticks, y=yAt(v);
    ctx.strokeStyle='#eef1f3'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle='#9aa3af'; ctx.textAlign='right'; ctx.fillText(String(Math.round(v)), padL-8, y);
  }
  // X 轴标签
  ctx.fillStyle='#9aa3af'; ctx.textAlign='center'; ctx.textBaseline='top';
  labels.forEach((lb,i)=>{ if(days.length<=6 || i%2===0) ctx.fillText(lb, xAt(i), H-padB+10); });
  // 画线
  function line(arr,color){
    ctx.strokeStyle=color; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.beginPath(); let st=false;
    arr.forEach((v,i)=>{ if(v==null){st=false;return;} const x=xAt(i),y=yAt(v); if(!st){ctx.moveTo(x,y);st=true;} else ctx.lineTo(x,y); });
    ctx.stroke();
    arr.forEach((v,i)=>{ if(v==null)return; const x=xAt(i),y=yAt(v);
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,2.6,0,Math.PI*2); ctx.fill(); });
  }
  line(series.high,'#e0556b');
  line(series.low,'#3d8c5d');
  line(series.hr,'#3a6fb0');
  // 图例
  const legend=[['收缩压','#e0556b'],['舒张压','#3d8c5d'],['心率','#3a6fb0']];
  let lx=padL; const ly=10;
  ctx.font='13px "PingFang SC",sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
  legend.forEach(it=>{
    ctx.fillStyle=it[1]; ctx.fillRect(lx, ly+3, 14, 4);
    ctx.fillStyle='#5b6770'; ctx.fillText(it[0], lx+20, ly+5);
    lx += 22 + ctx.measureText(it[0]).width + 18;
  });
}

function reportImageModal(title, sub, headers, rows, footer, fileName){
  const W=1080, pad=44;
  const titleH=110, subH=46, headerH=64, rowH=66, footerH=84, gap=18;
  const n=headers.length;
  const tableW=W-pad*2;
  const weights=headers.map((h,i)=> i===n-1?1.5:1);
  const wsum=weights.reduce((a,b)=>a+b,0);
  const colW=weights.map(w=>Math.floor(tableW*w/wsum));
  let used=colW.reduce((a,b)=>a+b,0); colW[n-1]+=tableW-used;
  const H=pad*2+titleH+subH+headerH+rows.length*rowH+footerH+gap+30;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#5d8c5d'; ctx.fillRect(0,0,W,10);
  ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.fillStyle='#1f2733'; ctx.font='bold 46px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(title, W/2, pad+titleH/2);
  ctx.fillStyle='#6b7785'; ctx.font='26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(sub, W/2, pad+titleH+subH/2);
  const hy=pad+titleH+subH;
  ctx.fillStyle='#eef4ec'; ctx.fillRect(pad,hy,tableW,headerH);
  ctx.fillStyle='#3d6a3d'; ctx.font='bold 28px "PingFang SC","Microsoft YaHei",sans-serif';
  let x=pad; headers.forEach((h,i)=>{ ctx.fillText(h, x+colW[i]/2, hy+headerH/2); x+=colW[i]; });
  let y=hy+headerH;
  rows.forEach((row,ri)=>{
    if(ri%2===1){ ctx.fillStyle='#f7faf6'; ctx.fillRect(pad,y,tableW,rowH); }
    x=pad;
    row.forEach((cell,i)=>{
      const isLast=i===n-1;
      ctx.fillStyle=isLast?'#3d6a3d':'#1f2733';
      ctx.font=(isLast?'bold ':'')+'26px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(String(cell), x+colW[i]/2, y+rowH/2);
      x+=colW[i];
    });
    y+=rowH;
  });
  ctx.strokeStyle='#d8dde4'; ctx.lineWidth=1; ctx.beginPath();
  x=pad; for(let i=0;i<=n;i++){ ctx.moveTo(x,hy); ctx.lineTo(x,y); x+=colW[i]||0; }
  ctx.moveTo(pad,hy); ctx.lineTo(pad+tableW,hy); ctx.moveTo(pad,y); ctx.lineTo(pad+tableW,y); ctx.stroke();
  const fy=y+gap;
  ctx.fillStyle='#eef4ec'; ctx.fillRect(pad,fy,tableW,footerH);
  ctx.fillStyle='#3d6a3d'; ctx.font='bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  if(footer.length===2){ ctx.textAlign='center'; ctx.fillText(footer[0], pad+colW[0]/2+30, fy+footerH/2); ctx.fillText(footer[1], pad+tableW-colW[n-1]/2, fy+footerH/2); }
  else { ctx.textAlign='left'; ctx.fillText(footer.join(' '), pad+16, fy+footerH/2); }
  ctx.fillStyle='#9aa3af'; ctx.font='22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.fillText('本报表由房东通过「房租水电管理」生成', W/2, fy+footerH+26);
  const url=c.toDataURL('image/png');
  const wrap=document.createElement('div'); wrap.style.marginTop='14px';
  wrap.innerHTML=`<p class="muted" style="text-align:center;font-size:14px;color:#5d8c5d">微信内请<b>长按图片 → 保存到相册</b>；其他浏览器点右侧按钮下载</p>
    <div style="text-align:center;overflow:auto"><img src="${url}" style="max-width:100%;border:1px solid #e3e3e3;border-radius:10px;margin-top:6px"></div>
    <div class="row-actions" style="justify-content:center"><a class="btn-gold" href="${url}" download="${fileName}.png">下载图片</a></div>`;
  $("modalResult").appendChild(wrap);
  setTimeout(()=>{ const box=$("modalBox"); if(box){ box.scrollTop=box.scrollHeight; } },50);
}

      $("a_err").textContent="注册成功，但需先验证。请在 Supabase 关掉 Confirm email 后重试登录";_authMode="login";$("a_submit").textContent="登 录";return;
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error){$("a_err").textContent="登录失败："+error.message;return;}
      const {data}=await sb.auth.getSession();cloud.user=data.session?data.session.user:null;
      if(!cloud.user){$("a_err").textContent="登录失败，请重试";return;}
      saveRemember(phone,pw);await pullFromCloud(true);enterApp();
    }
  }catch(e){$("a_err").textContent="出错了："+(e&&e.message?e.message:e);}
}
function enterApp(){document.body.classList.remove("logged-out");renderCloud();showView("home");}
function cloudSignOut(){const sb=getClient();if(sb)sb.auth.signOut();cloud.user=null;renderCloud();toast("已登出");}
function mergeById(local,remote,keyFn){const map=new Map(local.map(x=>[keyFn(x),x]));remote.forEach(rv=>{const k=keyFn(rv);const lv=map.get(k);if(!lv)map.set(k,rv);else if(!lv.updated_at||(rv.updated_at&&rv.updated_at>lv.updated_at))map.set(k,rv);});return [...map.values()];}
async function refreshDelegations(){const sb=getClient();if(!sb||!cloud.user)return;const phone=(cloud.user.email||"").replace("@login.local","");try{
  const {data:auths,error}=await sb.from('authorizations').select('*').eq('authorized_phone',phone);
  if(error)throw error;
  delegated=[];
  for(const a of (auths||[])){
    const {data:p}=await sb.from('properties').select('*').eq('id',a.property_id).maybeSingle();
    if(!p)continue;
    const {data:rooms}=await sb.from('rooms').select('*').eq('property_id',a.property_id);
    const rids=(rooms||[]).map(r=>r.id);
    let rds=[];
    if(rids.length){const {data:rd}=await sb.from('readings').select('*').in('room_id',rids);rds=rd||[];}
    delegated.push({ownerId:a.owner_id,code:a.code,prop:{id:p.id,name:p.name,location:p.location},
      rooms:(rooms||[]).map(rv=>({id:rv.id,name:rv.name,tenant:rv.tenant,leaseStart:rv.lease_start,leaseEnd:rv.lease_end,rent:rv.rent,mgmtFee:rv.mgmt_fee,waterPrice:rv.water_price,elecPrice:rv.elec_price,gasPrice:rv.gas_price,hotPrice:rv.hot_price})),
      readings:(rds||[]).map(rv=>({roomId:rv.room_id,month:rv.month,waterStart:rv.water_start,waterEnd:rv.water_end,elecStart:rv.elec_start,elecEnd:rv.elec_end,gasStart:rv.gas_start,gasEnd:rv.gas_end,hotStart:rv.hot_start,hotEnd:rv.hot_end}))});
  }
  const {data:my}=await sb.from('authorizations').select('*').eq('owner_id',cloud.user.id);
  myAuths=my||[];
}catch(e){delegated=[];myAuths=[];}}
async function pullFromCloud(silent){const sb=getClient();if(!sb||!cloud.user)return;if(_syncing)return;_syncing=true;try{const [pr,rr,rdr,dr]=await Promise.all([sb.from('properties').select('*'),sb.from('rooms').select('*'),sb.from('readings').select('*'),sb.from('settings').select('*').maybeSingle()]);if(pr.error)throw pr.error;if(rr.error)throw rr.error;if(rdr.error)throw rdr.error;if(dr.error)throw dr.error;const uid0=cloud.user.id;const P=(pr.data||[]).filter(rv=>rv.user_id===uid0).map(rv=>({id:rv.id,name:rv.name,location:rv.location,lat:rv.lat,lng:rv.lng,updated_at:rv.updated_at}));const R=(rr.data||[]).filter(rv=>rv.user_id===uid0).map(rv=>({id:rv.id,propertyId:rv.property_id,name:rv.name,tenant:rv.tenant,leaseStart:rv.lease_start,leaseEnd:rv.lease_end,rent:rv.rent,mgmtFee:rv.mgmt_fee,waterPrice:rv.water_price,elecPrice:rv.elec_price,gasPrice:rv.gas_price,hotPrice:rv.hot_price,initWater:(rv.init_water!=null?rv.init_water:null),initElec:(rv.init_elec!=null?rv.init_elec:null),initGas:(rv.init_gas!=null?rv.init_gas:null),initHot:(rv.init_hot!=null?rv.init_hot:null),updated_at:rv.updated_at}));const Rd=(rdr.data||[]).filter(rv=>rv.user_id===uid0).map(rv=>({roomId:rv.room_id,month:rv.month,waterStart:rv.water_start,waterEnd:rv.water_end,elecStart:rv.elec_start,elecEnd:rv.elec_end,gasStart:rv.gas_start,gasEnd:rv.gas_end,hotStart:rv.hot_start,hotEnd:rv.hot_end,updated_at:rv.updated_at}));state.properties=mergeById(state.properties,P,x=>x.id);state.rooms=mergeById(state.rooms,R,x=>x.id);state.readings=mergeById(state.readings,Rd,x=>x.roomId+x.month);if(dr&&dr.data){state.propDefaults=(dr.data.prop_defaults&&typeof dr.data.prop_defaults==='object')?dr.data.prop_defaults:{};normalizePropDefaults(state);}await refreshDelegations();save();cloud.lastSync=touch();saveCloudCfg();if(!silent)renderCloud();if(!silent)toast("已从云端同步");}catch(e){if(!silent)toast("同步失败："+(e&&e.message?e.message:e));}finally{_syncing=false;}}
async function pushToCloud(){const sb=getClient();if(!sb||!cloud.user)return;if(_syncing)return;_syncing=true;try{const t=touch();const P=state.properties.map(x=>({id:x.id,name:x.name,location:x.location,lat:x.lat,lng:x.lng,user_id:cloud.user.id,updated_at:t}));const R=state.rooms.map(x=>({id:x.id,property_id:x.propertyId,name:x.name,tenant:x.tenant,lease_start:x.leaseStart,lease_end:x.leaseEnd,rent:x.rent,mgmt_fee:x.mgmtFee,water_price:x.waterPrice,elec_price:x.elecPrice,gas_price:x.gasPrice,hot_price:x.hotPrice,init_water:x.initWater??null,init_elec:x.initElec??null,init_gas:x.initGas??null,init_hot:x.initHot??null,user_id:cloud.user.id,updated_at:t}));const Rd=state.readings.map(x=>({user_id:cloud.user.id,room_id:x.roomId,month:x.month,water_start:x.waterStart,water_end:x.waterEnd,elec_start:x.elecStart,elec_end:x.elecEnd,gas_start:x.gasStart,gas_end:x.gasEnd,hot_start:x.hotStart,hot_end:x.hotEnd,updated_at:t}));const a1=await sb.from('properties').upsert(P);if(a1.error)throw a1.error;
let a2=await sb.from('rooms').upsert(R);
if(a2.error){ // rooms 表若未加 init 列，去掉 init 字段重试（需运行 supabase_rooms_init.sql）
  const R0=state.rooms.map(x=>({id:x.id,property_id:x.propertyId,name:x.name,tenant:x.tenant,lease_start:x.leaseStart,lease_end:x.leaseEnd,rent:x.rent,mgmt_fee:x.mgmtFee,water_price:x.waterPrice,elec_price:x.elecPrice,gas_price:x.gasPrice,hot_price:x.hotPrice,user_id:cloud.user.id,updated_at:t}));
  a2=await sb.from('rooms').upsert(R0);if(a2.error)throw a2.error;
}const a3=await sb.from('readings').upsert(Rd,{onConflict:'user_id,room_id,month'});if(a3.error)throw a3.error;try{const a4=await sb.from('settings').upsert({user_id:cloud.user.id,water:DEF.water,elec:DEF.elec,gas:DEF.gas,hot:DEF.hot,mgmt:DEF.mgmt,prop_defaults:state.propDefaults,updated_at:t});if(a4.error)throw a4.error;}catch(e){/* settings 表若未加 prop_defaults 列，忽略（需运行 supabase_propdefaults.sql） */}cloud.lastSync=t;saveCloudCfg();toast("已同步到云端");}catch(e){toast("同步失败："+(e&&e.message?e.message:e));}finally{_syncing=false;}}
function renderCloud(){const logged=!!cloud.user;const phone=logged?(cloud.user.email||"").replace("@login.local",""):"";const ls=cloud.lastSync?new Date(cloud.lastSync).toLocaleString('zh-CN'):'从未';let html=`<div class="topbar">☁️ 云同步</div>`;if(logged){html+=`<div class="card"><h2>账号</h2><div class="muted">已登录手机号：${escapeHtml(phone)}</div><div class="row-actions"><button class="btn-line" onclick="cloudSignOut()">退出登录</button></div></div>`;html+=`<div class="card"><h2>同步</h2><div class="muted">上次同步：${ls}</div><div class="row-actions"><button class="btn-primary" onclick="pushToCloud()">立即上传到云端</button><button class="btn-ghost" onclick="pullFromCloud(false)">从云端拉取</button></div><div class="hint">每次本地保存（房源/房间/读数）后会自动上传。建议仍保留每月 JSON 备份作双保险。</div></div>`;}else{html+=`<div class="card"><div class="muted">未登录。请在打开应用时用手机号和密码登录。</div></div>`;}html+=`<div class="card"><div class="muted">说明：云同步把房源/房间/读数/默认费用存到免费 Supabase 数据库，换手机、换电脑登录同一手机号即可恢复全部历史。数据按账号隔离，仅你可见。</div></div>`;$("contentInner").innerHTML=html;}
startupCloud();
