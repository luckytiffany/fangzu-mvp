<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房租水电管理</title>
<style>
  :root{
    --bg:#f5f2ed; --card:#fffefb; --line:#e8e3da; --ink:#2b3a2b; --sub:#6e7d6e;
    --brand:#5d8c5d; --brand-soft:#e8f0e5; --brand-d:#3d6a3d; --ok:#5d8c5d; --warn:#c49a3b; --danger:#b85656;
    --gold:#c8a876; --gold-soft:#f5efe4; --ink2:#4a5a4a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65}
  /* 米纸纹理底 */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:-1;
    background:radial-gradient(circle at 20% 10%, rgba(93,140,93,.10) 0, transparent 28%),
               radial-gradient(circle at 90% 80%, rgba(200,168,118,.12) 0, transparent 24%);
  }
  .app{display:flex;min-height:100vh}
  /* 顶部常驻菜单按钮 */
  .menu-btn{position:fixed;left:16px;top:16px;z-index:80;background:#fff;border:1px solid var(--line);border-radius:50px;
    padding:10px 18px;font-size:16px;font-weight:700;color:var(--brand-d);box-shadow:0 3px 10px rgba(43,58,43,.08);display:flex;align-items:center;gap:8px}
  .menu-btn:active{transform:translateY(1px)}
  /* 导航抽屉（弹窗式） */
  .nav-drawer{position:fixed;inset:0;z-index:200;display:none}
  .nav-drawer.open{display:block}
  .nav-backdrop{position:absolute;inset:0;background:rgba(30,40,30,.42);backdrop-filter:blur(2px)}
  .nav-panel{position:absolute;left:0;top:0;bottom:0;width:280px;background:linear-gradient(180deg,#fffefb 0%,#f7f4ee 100%);
    border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(43,58,43,.12);padding:22px 16px;overflow:auto;animation:slideIn .22s ease-out}
  @keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  .nav-close{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px;color:var(--sub)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;padding:8px 6px 22px;color:var(--brand-d)}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 8px rgba(61,106,61,.22)}
  .brand small{display:block;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:1px}
  .nav-group{margin-bottom:10px}
  .nav-head,.nav-leaf{width:100%;text-align:left;padding:14px 16px;font-weight:700;cursor:pointer;border-radius:14px;color:var(--ink);user-select:none;
    background:#fff;border:1px solid var(--line);font-size:17px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 4px rgba(43,58,43,.04)}
  .nav-head:hover,.nav-leaf:hover{background:var(--brand-soft);border-color:#d0e0d0}
  .nav-head:active,.nav-leaf:active{transform:translateY(1px)}
  .nav-head .chev{color:var(--sub);font-size:14px;transition:.2s}
  .nav-head.active .chev{transform:rotate(90deg)}
  .nav-leaf.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* 二级菜单弹窗 */
  .subnav-popup{position:absolute;left:296px;top:0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 40px rgba(43,58,43,.18);display:none;min-width:210px;z-index:210;animation:popIn .18s ease-out}
  @keyframes popIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  .subnav-title{font-size:15px;color:var(--sub);margin-bottom:12px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .subnav-item{display:block;width:100%;text-align:left;padding:13px 14px;margin:7px 0;border-radius:12px;background:var(--gold-soft);border:1px solid #eaddcc;color:var(--ink2);font-size:16px;font-weight:700;cursor:pointer}
  .subnav-item:hover{background:#ede4d3}
  .subnav-item.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* 内容区 */
  .content{flex:1;padding:18px;min-width:0;padding-top:72px}
  .topbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(43,58,43,.05)}
  .topbar .ico{font-size:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 10px rgba(43,58,43,.06)}
  .card h2{margin:0 0 14px;font-size:19px;color:var(--ink2)}
  .card h3{margin:0 0 10px;font-size:17px;color:var(--ink2)}
  label{display:block;font-size:15px;color:var(--sub);margin:10px 0 5px;font-weight:600}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  input:disabled,select:disabled{background:#efece4;color:#8a948a;cursor:not-allowed}
  button:disabled{opacity:.55;cursor:not-allowed}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  @media(max-width:760px){.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
  .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 3px 10px rgba(61,106,61,.22)}
  .btn-primary:active{filter:brightness(.95);transform:translateY(1px)}
  .btn-ghost{background:var(--brand-soft);color:var(--brand-d)}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#b08c5a);color:#fff;box-shadow:0 3px 10px rgba(176,140,90,.22)}
  .btn-gold:active{filter:brightness(.95)}
  .btn-danger{background:#fff;border:1px solid var(--danger);color:var(--danger)}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--sub);font-weight:700;background:#faf8f3}
  td input{width:96px;padding:9px;border-radius:10px;font-size:15px}
  .muted{color:var(--sub);font-size:14px}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
  .badge-soon{background:#f9f1d8;color:var(--warn)}
  .badge-expired{background:#f8e5e3;color:var(--danger)}
  .badge-ok{background:#e8f0e5;color:var(--ok)}
  .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  @media(min-width:860px){.summary{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:480px){.summary{grid-template-columns:1fr}}
  .stat{background:linear-gradient(135deg,var(--brand-soft),#f7f4ee);border-radius:14px;padding:14px;border:1px solid #dce8da}
  .stat .k{font-size:14px;color:var(--brand-d);font-weight:700}
  .stat .v{font-size:24px;font-weight:800;color:var(--brand-d);margin-top:4px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b3a2b;color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .empty{color:var(--sub);text-align:center;padding:28px 0;font-size:16px}
  .hint{font-size:14px;color:var(--ink2);background:#f9f6ef;border:1px solid #e8e0d0;border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.7}
  .banner{background:#f9f1d8;border:1px solid #e8d8b0;border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:15px;line-height:1.8}
  .banner b{color:var(--warn)}
  .card.alert{border-color:var(--danger);background:#fff8f5;box-shadow:0 0 0 4px rgba(192,72,59,.08)}
  .tag-ok{color:var(--ok);font-weight:700}
  .tag-warn{color:var(--warn);font-weight:700}
  .prop-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#faf8f3;border:1px solid var(--line);border-radius:14px;cursor:pointer;font-weight:800;font-size:17px;margin-bottom:10px}
  .prop-head:hover{background:#f3efe7}
  .prop-head .chev{color:var(--sub);transition:.2s}
  .prop-head.open .chev{transform:rotate(90deg)}
  /* 生成账单-房间折叠 */
  .bill-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:8px 4px;border-radius:12px}
  .bill-head:hover{background:#f8f6f1}
  .bill-head:active{background:#f0ece3}
  .bill-title{display:flex;align-items:center;gap:11px;min-width:0}
  .bill-title .chev{color:var(--sub);transition:transform .2s;font-size:16px;display:inline-block}
  .room-name{font-size:24px;font-weight:800;color:var(--ink2);letter-spacing:.5px}
  .bill-body{padding-top:4px}
  /* 账单用量核对表格 */
  .bill-detail-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}
  .bill-detail-table th,.bill-detail-table td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
  .bill-detail-table th{background:#faf8f3;color:var(--sub);font-weight:700}
  .bill-detail-table td:first-child,.bill-detail-table th:first-child{text-align:left}
  .bill-detail-table .amt{font-weight:800;color:var(--brand-d)}
  @media(max-width:760px){.app{flex-direction:column}.nav-panel{width:85%}.subnav-popup{left:10px;right:10px;top:auto;bottom:20px}.content{padding-left:14px;padding-right:14px}}
  /* 入口登录页 */
  #authScreen{position:fixed;inset:0;background:linear-gradient(160deg,#e8f0e5 0%,#f5efe4 60%,#f5f2ed 100%);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
  body.logged-out #authScreen{display:flex}
  body.logged-out .app{display:none}
  .auth-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 26px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(43,58,43,.12)}
  .auth-card .brand{font-size:24px;justify-content:center;padding-bottom:6px}
  .auth-card .sub{text-align:center;color:var(--sub);font-size:15px;margin:6px 0 22px}
  .auth-card label{margin-top:14px}
  .auth-card .row-actions{margin-top:20px}
  .auth-card .switch{text-align:center;margin-top:18px;font-size:15px;color:var(--sub)}
  .auth-card .switch a{color:var(--brand-d);cursor:pointer;font-weight:700}
  .auth-err{color:var(--danger);font-size:15px;min-height:20px;margin-top:10px}
</style>
</head>
<body class="logged-out">
<div class="app">
  <!-- 导航抽屉（弹窗式菜单） -->
  <aside class="nav-drawer" id="navDrawer">
    <div class="nav-backdrop" onclick="closeNav()"></div>
    <div class="nav-panel">
      <button class="nav-close" onclick="closeNav()">✕</button>
      <div class="brand"><span class="logo">🏠</span>房租水电<small>房东好帮手</small></div>
      <div class="nav-group">
        <button class="nav-head" onclick="openSubNav('g1',this)">房屋管理 <span class="chev">▸</span></button>
      </div>
      <div class="nav-group">
        <button class="nav-head" onclick="openSubNav('g_bill',this)">账单管理 <span class="chev">▸</span></button>
      </div>
      <div class="nav-group">
        <button class="nav-head" onclick="openSubNav('g3',this)">设置 <span class="chev">▸</span></button>
      </div>
      <div class="nav-group">
        <button class="nav-head" onclick="openSubNav('g4',this)">个人中心 <span class="chev">▸</span></button>
      </div>
    </div>
    <!-- 二级菜单弹窗 -->
    <div class="subnav-popup" id="subnavPopup">
      <div class="subnav-title" id="subnavTitle">菜单</div>
      <div class="subnav-items" id="subnavItems"></div>
    </div>
  </aside>
  <main class="content" id="content">
    <button class="menu-btn" onclick="openNav()">☰ 菜单</button>
    <div id="contentInner"></div>
  </main>
</div>
<div id="authScreen">
  <div class="auth-card">
    <div class="brand"><span class="logo">🏠</span>房租水电管理<small>房东好帮手</small></div>
    <div class="sub">房东登录 · 数据自动云端同步</div>
    <label>手机号</label>
    <input id="a_phone" placeholder="请输入手机号" inputmode="numeric" maxlength="15">
    <label>密码</label>
    <input id="a_pw" type="password" placeholder="至少6位">
    <div class="auth-err" id="a_err"></div>
    <div class="row-actions"><button class="btn-primary" id="a_submit" style="flex:1" onclick="authSubmit()">登 录</button></div>
    <div class="switch">还没有账号？<a onclick="authToggle()">注册新账号</a></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="supabase.min.js"></script>

<script>
const KEY="rental_mvp_v1";
const DEF={water:3.5,elec:0.65,gas:3.2,hot:8,mgmt:100};
let state=load();
let editingRoomId=null;
let lastReadMonth=curMonth(),lastBillMonth=curMonth(),lastHistoryMonth=prevMonth(curMonth());
let _authProp=null;        // 当前正在管理授权的房源
let delegated=[];          // 受托人视角：被授权的楼栋及房间/读数
let myAuths=[];            // 房东视角：我发出的授权列表

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));
    if(s){
      s.propDefaults=s.propDefaults||{};
      s.properties=s.properties||[];
      // 迁移：旧的全局 defaults → 各房源独立默认费用
      if(s.defaults){
        s.properties.forEach(p=>{ if(!s.propDefaults[p.id]) s.propDefaults[p.id]=Object.assign({},s.defaults); });
        delete s.defaults;
      }
      if(s.rooms&&s.rooms.length&&!s.properties.length){
        const pid=uid();s.properties=[{id:pid,name:'默认楼栋',location:''}];
        s.rooms.forEach(r=>r.propertyId=pid);
      }
      s.rooms=s.rooms||[];s.readings=s.readings||[];
      normalizePropDefaults(s);
      return s;
    }
  }catch(e){}
  return {properties:[],propDefaults:{},rooms:[],readings:[]};
}
function normalizePropDefaults(s){
  s.propDefaults=s.propDefaults||{};
  s.properties.forEach(p=>{
    const d=s.propDefaults[p.id]||{};
    ['water','elec','gas','hot','mgmt'].forEach(k=>{ if(d[k]==null) d[k]=DEF[k]; });
    s.propDefaults[p.id]=d;
  });
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));scheduleSync();}
function $(id){return document.getElementById(id);}
function fmt(n){if(n==null||isNaN(n))return "0.00";return Number(n).toFixed(2);}
function curMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function prevMonth(m){const[y,mm]=m.split("-").map(Number);const d=new Date(y,mm-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function monthLabel(m){const[y,mm]=m.split("-");return y+"年"+Number(mm)+"月";}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getProp(id){return state.properties.find(p=>p.id===id);}
function getPropName(room){const p=getProp(room.propertyId);return p?p.name:'出租楼';}
function getPropDefault(pid,key){const d=(state.propDefaults&&state.propDefaults[pid])||{};return d[key]!=null?d[key]:DEF[key];}

/* ---------- 导航（弹窗抽屉式） ---------- */
const NAV_GROUPS={
  g1:{title:'房屋管理', children:[
    {v:'addProperty',l:'添加房源'},
    {v:'addRoom',l:'添加房间'},
    {v:'roomList',l:'房间列表'},
    {v:'defaultFees',l:'水电费用'}
  ]},
  g_bill:{title:'账单管理', children:[
    {v:'bill',l:'本月账单'},
    {v:'history',l:'历史账单'},
    {v:'reading',l:'录入本月读数'}
  ]},
  g3:{title:'设置', children:[
    {v:'data',l:'数据备份'},
    {v:'cloud',l:'云同步'}
  ]},
  g4:{title:'个人中心', children:[
    {v:'stats',l:'数据统计'}
  ]}
};
let currentView='addProperty';
function openNav(){$('navDrawer').classList.add('open'); closeSubNav();}
function closeNav(){$('navDrawer').classList.remove('open'); closeSubNav();}
function openSubNav(g,btn){
  const gp=NAV_GROUPS[g]; if(!gp)return;
  $('subnavTitle').textContent=gp.title;
  $('subnavItems').innerHTML=gp.children.map(c=>
    `<button class="subnav-item ${currentView===c.v?'active':''}" data-view="${c.v}" onclick="showView('${c.v}');closeNav()">${c.l}</button>`
  ).join('');
  const popup=$('subnavPopup'); popup.style.display='block';
  if(btn&&window.innerWidth>760){const r=btn.getBoundingClientRect(); popup.style.top=(Math.max(16,r.top+window.scrollY))+'px'; popup.style.bottom='auto';}
}
function closeSubNav(){$('subnavPopup').style.display='none';}
function showView(v){
  currentView=v;
  document.querySelectorAll("[data-view]").forEach(c=>c.classList.toggle("active",c.dataset.view===v));
  const fn={addProperty:renderAddProperty,addRoom:renderAddRoom,defaultFees:renderDefaultFees,
    roomList:renderRoomList,reading:renderReading,bill:renderBill,history:renderHistoryBill,
    data:renderData,cloud:renderCloud,auth:renderAuthManage,stats:renderStats}[v];
  if(fn)fn();
  window.scrollTo(0,0);
}
// ESC 关闭抽屉
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});

/* ---------- 添加房源 ---------- */
function renderAddProperty(){
  $("contentInner").innerHTML=`<div class="topbar">🏢 添加房源</div>
  <div class="card">
    <h2>新建楼栋 / 房源</h2>
    <div class="grid g2">
      <div><label>房源名称（如：XX花园3栋）</label><input id="p_name" maxlength="20" placeholder="例：珠江花园3栋"></div>
      <div><label>地址 / 定位</label><input id="p_loc" placeholder="可手动填写，或点右侧获取定位"></div>
    </div>
    <div class="row-actions">
      <button class="btn-ghost" onclick="getGeo()">📍 获取定位</button>
      <span class="muted" id="geo_tip">定位将填充经纬度，便于后续导航</span>
    </div>
    <div class="row-actions"><button class="btn-primary" onclick="saveProperty()">保存房源</button></div>
    <div id="propListMini"></div>
  </div>`;
  renderPropMini();
}
function renderPropMini(){
  const box=$("propListMini");if(!box)return;
  if(!state.properties.length){box.innerHTML='<div class="empty">还没有房源</div>';return;}
  const rows=state.properties.map(p=>`<tr><td><b>${escapeHtml(p.name)}</b></td><td class="muted">${escapeHtml(p.location||"未填地址")}${p.lat?` · ${fmt(p.lat)},${fmt(p.lng)}`:""}</td>
    <td><button class="btn-line" onclick="delProperty('${p.id}')">删除</button></td></tr>`).join("");
  box.innerHTML=`<h2 style="margin-top:14px">已有房源（${state.properties.length}）</h2>
    <table><thead><tr><th>名称</th><th>地址/定位</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function saveProperty(){
  const name=$("p_name").value.trim();if(!name){toast("请填写房源名称");return;}
  if(state.properties.some(p=>p.name===name)){toast("房源名称已存在");return;}
  state.properties.push({id:uid(),name,location:$("p_loc").value.trim(),lat:null,lng:null});
  save();$("p_name").value="";$("p_loc").value="";renderPropMini();toast("房源已保存");
}
function delProperty(id){
  const p=getProp(id);if(!p)return;
  if(!confirm(`删除房源「${p.name}」？其下 ${state.rooms.filter(r=>r.propertyId===id).length} 个房间及抄表记录也会删除。`))return;
  state.properties=state.properties.filter(x=>x.id!==id);
  const rids=state.rooms.filter(r=>r.propertyId===id).map(r=>r.id);
  state.rooms=state.rooms.filter(r=>r.propertyId!==id);
  state.readings=state.readings.filter(r=>!rids.includes(r.roomId));
  save();renderPropMini();toast("已删除");
}
function getGeo(){
  if(!navigator.geolocation){toast("当前环境不支持定位，请手动填写");return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const la=pos.coords.latitude,ln=pos.coords.longitude;
    $("p_loc").value=`经纬度 ${la.toFixed(5)},${ln.toFixed(5)}`;
    toast("已获取定位");
  },()=>toast("定位失败，请手动填写地址"),{enableHighAccuracy:true,timeout:8000});
}

function leaseInfo(r){
  if(!r.leaseEnd)return null;
  const end=new Date(r.leaseEnd+"T00:00:00");const today=new Date();today.setHours(0,0,0,0);
  const days=Math.round((end-today)/86400000);
  if(days<0)return {type:'expired',days:Math.abs(days)};
  if(days<=30)return {type:'soon',days};
  return {type:'ok',days};
}

function roomReadCard(r,m){

function recalcRead(rid){
  const r=state.rooms.find(x=>x.id===rid);if(!r)return;
  const meters=[['w','waterPrice',' 吨'],['e','elecPrice',' 度'],['g','gasPrice',' 方'],['h','hotPrice',' 吨']];

/* ---------- 生成账单 ---------- */
function computeBill(r,reading){
  const get=(s,e)=>(reading&&reading[s]!=null&&reading[e]!=null)?(reading[e]-reading[s]):0;
  const wC=get('waterStart','waterEnd'),eC=get('elecStart','elecEnd'),gC=get('gasStart','gasEnd'),hC=get('hotStart','hotEnd');
  const wCost=wC*r.waterPrice,eCost=eC*r.elecPrice,gCost=gC*r.gasPrice,hotCost=hC*r.hotPrice;
  const util=wCost+eCost+gCost+hotCost;const total=r.rent+r.mgmtFee+util;
  return {wC,eC,gC,hC,wCost,eCost,gCost,hotCost,util,total};
}
function buildBillText(r,reading,m){
  const b=computeBill(r,reading);
  const L=[];
  L.push("【房租水电费通知】");
  L.push((r.tenant||"租户")+"（"+getPropName(r)+" "+r.name+"）：");
  L.push(monthLabel(m)+"费用如下：");
  L.push("• 月租："+fmt(r.rent)+" 元");
  L.push("• 管理费："+fmt(r.mgmtFee)+" 元");
  if(reading&&reading.waterStart!=null&&reading.waterEnd!=null)L.push("• 水费：用水 "+fmt(b.wC)+" 吨 × "+fmt(r.waterPrice)+" = "+fmt(b.wCost)+" 元");
  if(reading&&reading.elecStart!=null&&reading.elecEnd!=null)L.push("• 电费：用电 "+fmt(b.eC)+" 度 × "+fmt(r.elecPrice)+" = "+fmt(b.eCost)+" 元");
  if(reading&&reading.gasStart!=null&&reading.gasEnd!=null)L.push("• 燃气费：用气 "+fmt(b.gC)+" 方 × "+fmt(r.gasPrice)+" = "+fmt(b.gCost)+" 元");
  if(reading&&reading.hotStart!=null&&reading.hotEnd!=null)L.push("• 热水费：用热 "+fmt(b.hC)+" 吨 × "+fmt(r.hotPrice)+" = "+fmt(b.hotCost)+" 元");
  L.push("本月应交租金合计："+fmt(b.total)+" 元");
  L.push("请于每月约定日前支付，谢谢配合！");
  return L.join("\n");
}

/* ---------- 账单图片（16:9 插画风） ---------- */
function bi_roundRect(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}
function bi_cloud(x,cx,cy,r){x.beginPath();x.arc(cx,cy,r,Math.PI*.95,Math.PI*2.05);x.arc(cx+r*.8,cy+r*.32,r*.7,Math.PI*.95,Math.PI*2.05);x.arc(cx-r*.8,cy+r*.32,r*.7,Math.PI*.95,Math.PI*2.05);x.closePath();x.fill();}
function bi_house(x,bx,by,w,h){
  x.fillStyle='#ffffff';
  x.beginPath();x.moveTo(bx-12,by);x.lineTo(bx+w/2,by-h*.62);x.lineTo(bx+w+12,by);x.closePath();x.fill();
  x.fillRect(bx,by,w,h);
  x.fillStyle='rgba(15,184,106,.92)';x.fillRect(bx+w*.36,by+h*.42,w*.28,h*.58);
  x.fillStyle='rgba(255,255,255,.95)';x.fillRect(bx+w*.12,by+h*.16,w*.2,h*.2);x.fillRect(bx+w*.68,by+h*.16,w*.2,h*.2);
}
function bi_coin(x,cx,cy,r){
  x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fillStyle='#ffd45e';x.fill();
  x.lineWidth=Math.max(2,r*.12);x.strokeStyle='#efb429';x.stroke();
  x.fillStyle='#b9791a';x.font='bold '+(r*1.05)+'px -apple-system,"PingFang SC",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('¥',cx,cy+r*.04);
}
function downloadBillImage(rid,m){
  const r=state.rooms.find(x=>x.id===rid);if(!r)return;
  const reading=getReading(rid,m);const b=computeBill(r,reading);
  const W=1080,H=1440,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F='"PingFang SC","Microsoft YaHei",-apple-system,sans-serif';
  // 米色纸纹底
  x.fillStyle='#f7f4ee';x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.18;
  x.strokeStyle='#d8d0c0';x.lineWidth=1;
  for(let i=0;i<W;i+=34){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}
  for(let i=0;i<H;i+=34){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
  x.restore();
  // 表头：国风山水插画

  const {data:my}=await sb.from('authorizations').select('*').eq('owner_id',cloud.user.id);
  myAuths=my||[];
}catch(e){delegated=[];myAuths=[];}}
async function pullFromCloud(silent){const sb=getClient();if(!sb||!cloud.user)return;if(_syncing)return;_syncing=true;try{const [pr,rr,rdr,dr]=await Promise.all([sb.from('properties').select('*'),sb.from('rooms').select('*'),sb.from('readings').select('*'),sb.from('settings').select('*').maybeSingle()]);if(pr.error)throw pr.error;if(rr.error)throw rr.error;if(rdr.error)throw rdr.error;if(dr.error)throw dr.error;const uid0=cloud.user.id;const P=(pr.data||[]).filter(rv=>rv.user_id===uid0).map(rv=>({id:rv.id,name:rv.name,location:rv.location,lat:rv.lat,lng:rv.lng,updated_at:rv.updated_at}));const R=(rr.data||[]).filter(rv=>rv.user_id===uid0).map(rv=>({id:rv.id,propertyId:rv.property_id,name:rv.name,tenant:rv.tenant,leaseStart:rv.lease_start,leaseEnd:rv.lease_end,rent:rv.rent,mgmtFee:rv.mgmt_fee,waterPrice:rv.water_price,elecPrice:rv.elec_price,gasPrice:rv.gas_price,hotPrice:rv.hot_price,updated_at:rv.updated_at}));const Rd=(rdr.data||[]).filter(rv=>rv.user_id===uid0).map(rv=>({roomId:rv.room_id,month:rv.month,waterStart:rv.water_start,waterEnd:rv.water_end,elecStart:rv.elec_start,elecEnd:rv.elec_end,gasStart:rv.gas_start,gasEnd:rv.gas_end,hotStart:rv.hot_start,hotEnd:rv.hot_end,updated_at:rv.updated_at}));state.properties=mergeById(state.properties,P,x=>x.id);state.rooms=mergeById(state.rooms,R,x=>x.id);state.readings=mergeById(state.readings,Rd,x=>x.roomId+x.month);if(dr&&dr.data){state.propDefaults=(dr.data.prop_defaults&&typeof dr.data.prop_defaults==='object')?dr.data.prop_defaults:{};normalizePropDefaults(state);}await refreshDelegations();save();cloud.lastSync=touch();saveCloudCfg();if(!silent)renderCloud();if(!silent)toast("已从云端同步");}catch(e){if(!silent)toast("同步失败："+(e&&e.message?e.message:e));}finally{_syncing=false;}}
async function pushToCloud(){const sb=getClient();if(!sb||!cloud.user)return;if(_syncing)return;_syncing=true;try{const t=touch();const P=state.properties.map(x=>({id:x.id,name:x.name,location:x.location,lat:x.lat,lng:x.lng,user_id:cloud.user.id,updated_at:t}));const R=state.rooms.map(x=>({id:x.id,property_id:x.propertyId,name:x.name,tenant:x.tenant,lease_start:x.leaseStart,lease_end:x.leaseEnd,rent:x.rent,mgmt_fee:x.mgmtFee,water_price:x.waterPrice,elec_price:x.elecPrice,gas_price:x.gasPrice,hot_price:x.hotPrice,user_id:cloud.user.id,updated_at:t}));const Rd=state.readings.map(x=>({user_id:cloud.user.id,room_id:x.roomId,month:x.month,water_start:x.waterStart,water_end:x.waterEnd,elec_start:x.elecStart,elec_end:x.elecEnd,gas_start:x.gasStart,gas_end:x.gasEnd,hot_start:x.hotStart,hot_end:x.hotEnd,updated_at:t}));const a1=await sb.from('properties').upsert(P);if(a1.error)throw a1.error;const a2=await sb.from('rooms').upsert(R);if(a2.error)throw a2.error;const a3=await sb.from('readings').upsert(Rd,{onConflict:'user_id,room_id,month'});if(a3.error)throw a3.error;try{const a4=await sb.from('settings').upsert({user_id:cloud.user.id,water:DEF.water,elec:DEF.elec,gas:DEF.gas,hot:DEF.hot,mgmt:DEF.mgmt,prop_defaults:state.propDefaults,updated_at:t});if(a4.error)throw a4.error;}catch(e){/* settings 表若未加 prop_defaults 列，忽略（需运行 supabase_propdefaults.sql） */}cloud.lastSync=t;saveCloudCfg();toast("已同步到云端");}catch(e){toast("同步失败："+(e&&e.message?e.message:e));}finally{_syncing=false;}}
function renderCloud(){const logged=!!cloud.user;const phone=logged?(cloud.user.email||"").replace("@login.local",""):"";const ls=cloud.lastSync?new Date(cloud.lastSync).toLocaleString('zh-CN'):'从未';let html=`<div class="topbar">☁️ 云同步</div>`;if(logged){html+=`<div class="card"><h2>账号</h2><div class="muted">已登录手机号：${escapeHtml(phone)}</div><div class="row-actions"><button class="btn-line" onclick="cloudSignOut()">退出登录</button></div></div>`;html+=`<div class="card"><h2>同步</h2><div class="muted">上次同步：${ls}</div><div class="row-actions"><button class="btn-primary" onclick="pushToCloud()">立即上传到云端</button><button class="btn-ghost" onclick="pullFromCloud(false)">从云端拉取</button></div><div class="hint">每次本地保存（房源/房间/读数）后会自动上传。建议仍保留每月 JSON 备份作双保险。</div></div>`;}else{html+=`<div class="card"><div class="muted">未登录。请在打开应用时用手机号和密码登录。</div></div>`;}html+=`<div class="card"><div class="muted">说明：云同步把房源/房间/读数/默认费用存到免费 Supabase 数据库，换手机、换电脑登录同一手机号即可恢复全部历史。数据按账号隔离，仅你可见。</div></div>`;$("contentInner").innerHTML=html;}
startupCloud();
</script>
